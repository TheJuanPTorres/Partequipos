name: CI

# En Next 16 `next build` ya NO ejecuta el linter (ver ADR 0001), así que un
# error de lint o de tipos podría llegar a main sin que nadie lo note.
# Este workflow es el que lo impide.
on:
  push:
    branches: [main]
  pull_request:

# Si se empuja dos veces seguidas a la misma rama, cancela la ejecución anterior:
# solo interesa el resultado del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, formato y tests
    runs-on: ubuntu-latest
    # Nada aquí necesita base de datos ni secretos: los cuatro pasos corren
    # sin conexión (verificado). Por eso el workflow no declara ningún `secrets`.
    permissions:
      contents: read

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        # v7 es la major vigente. Las v4 apuntan al runtime de Node 20, ya
        # deprecado en los runners, que las fuerza a ejecutarse sobre Node 24.
        uses: actions/setup-node@v7
        with:
          # La versión sale de .nvmrc, el MISMO archivo que respeta Vercel junto
          # con `engines.node` en package.json. Así CI y despliegue no divergen.
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        # `npm ci` instala exactamente lo del package-lock y falla si está
        # desincronizado con package.json, que es lo que se quiere en CI.
        #
        # OJO al regenerar el lock: hay que hacerlo con una instalación limpia
        # (`rm package-lock.json && rm -rf node_modules && npm install`).
        # Actualizarlo con `npm install --package-lock-only` desde Windows
        # re-resuelve el árbol para esa plataforma y descarta entradas que la
        # resolución de Linux necesita (p. ej. `@emnapi/runtime`, `@emnapi/core`),
        # lo que rompe este paso con `EUSAGE` aunque en local funcione.
        run: npm ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm test

  migrar-desde-cero:
    # Aplica TODAS las migraciones a un Postgres vacío con el mismo comando que
    # el build de Vercel (`deploy:migrate`) y exige que la estructura resultante
    # coincida con el snapshot de la última (CLAUDE.md §10.33 p.5). Atrapa una
    # migración que solo funciona sobre la base donde se escribió (§10.33 p.13).
    # No cubre: bases con datos, valores por defecto, `down` ni lo propio de Neon.
    name: Migrar desde cero
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Supuesto: Neon usa Postgres 17 en proyectos nuevos (no se pudo leer
        # la versión del proyecto al escribir esto).
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base efímera del job y secreto de relleno: nada real.
      DATABASE_URI: postgres://ci:ci@127.0.0.1:5432/ci
      PAYLOAD_SECRET: ci-sin-secreto
      PAYLOAD_DISABLE_PUSH: "true"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Migrar con el comando del build
        run: npm run deploy:migrate < /dev/null

      - name: Comparar la estructura con el snapshot
        run: npx tsx scripts/db/estructura-ci.ts
